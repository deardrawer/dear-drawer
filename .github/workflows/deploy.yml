name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify critical routes
        run: node scripts/verify-routes.mjs

      # Google 글꼴(next/font/google)을 빌드 중에 받아오다 가끔 실패함 — 그 경우만 잠깐 쉬었다가 최대 3번까지 다시 빌드
      - name: Build for Cloudflare
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::Build attempt $attempt"
            if npm run build:cloudflare 2>&1 | tee build.log; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if ! grep -q "next/font/google" build.log; then
              echo "Build failed (not a Google Fonts fetch error) — not retrying"
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Google Fonts fetch failed — retrying in $((attempt * 30))s"
              rm -rf .next .open-next
              sleep $((attempt * 30))
            fi
          done
          echo "Build failed 3 times on Google Fonts fetch"
          exit 1
        env:
          NEXT_PUBLIC_KAKAO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_KAKAO_CLIENT_ID }}
          NEXT_PUBLIC_KAKAO_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_KAKAO_REDIRECT_URI }}
          NEXT_PUBLIC_R2_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_R2_PUBLIC_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

      - name: Set VAPID private key secret
        run: echo "$VAPID_PRIVATE_KEY" | npx wrangler pages secret put VAPID_PRIVATE_KEY --project-name=dear-drawer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .open-next --project-name=dear-drawer --branch=${{ github.ref_name }} --commit-dirty=true --commit-message="${{ github.sha }}"
