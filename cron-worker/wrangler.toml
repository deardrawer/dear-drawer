# dear-drawer 알림 크론 전용 Worker
# 배경: 본 앱은 Cloudflare "Pages"로 배포되는데, Pages는 Cron Triggers를 지원하지 않습니다.
#   그래서 알림 스케줄을 GitHub Actions(schedule)로 돌렸는데, GitHub은 고빈도 cron(*/5)을
#   부하 시 대부분 드롭합니다(실측: 예상 대비 ~2% 실행, 중앙값 간격 ~3.8시간).
#   Cloudflare Workers의 Cron Trigger는 스케줄을 신뢰성 있게 실행하므로 이 Worker로 대체합니다.
name = "dear-drawer-cron"
main = "src/index.js"
compatibility_date = "2024-12-01"

# 5분마다 실행 (원하면 "*/1 * * * *"로 1분 단위도 가능 — Workers는 최소 1분)
[triggers]
crons = ["*/5 * * * *"]

[vars]
# 프로덕션 API 도메인
API_URL = "https://invite.deardrawer.com"

# CRON_SECRET 은 코드/설정에 넣지 말고 시크릿으로:
#   wrangler secret put CRON_SECRET
# (앱의 CRON_SECRET 과 동일한 값이어야 함)

[observability]
enabled = true
