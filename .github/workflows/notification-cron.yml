name: Send Geunnal Notifications

on:
  # 예약 실행은 Cloudflare Worker(cron-worker, Cron Trigger)로 이관됨.
  #   GitHub Actions는 고빈도 schedule을 대량 드롭해 알림이 누락됐음(실측 기대의 ~2%).
  #   여기서는 schedule을 제거하고 수동 실행(workflow_dispatch)만 남긴다.
  workflow_dispatch:
    # 수동 실행 가능 (필요 시 GitHub에서 직접 트리거)

jobs:
  send-notifications:
    runs-on: ubuntu-latest

    steps:
      - name: Send push notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: ${{ secrets.API_URL }}
        run: |
          echo "Sending notifications at $(date)"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${API_URL}/api/geunnal/notifications/send" -H "Authorization: Bearer ${CRON_SECRET}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Error: API returned status $HTTP_CODE"
            exit 1
          fi

          echo "Notifications sent successfully"
