# dear-drawer notification cron Worker (standalone).
# Cloudflare Pages cannot run Cron Triggers, so this dedicated Worker does.
# NOTE: keep this file ASCII-only to avoid TOML parse/encoding issues.
name = "dear-drawer-cron"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Run every 5 minutes (Workers cron min = 1 minute; use "*/1 * * * *" for 1-min).
[triggers]
crons = ["*/5 * * * *"]

# Production API domain. CRON_SECRET is set separately via: wrangler secret put CRON_SECRET
[vars]
API_URL = "https://invite.deardrawer.com"

# Keep Observability (Workers logs) ON across deploys, so a `wrangler deploy`
# does not turn off logging that was enabled in the dashboard.
[observability]
enabled = true
head_sampling_rate = 1
